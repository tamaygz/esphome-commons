# Feature that limits maximum active (ON) time of a device.
# Monitor a switch or output by triggering on state changes.
#
# Variables:
#   monitored_switch: ID of the switch to turn off when max active time is reached.
#   id: prefix for generated component IDs (default: maxactive)
substitutions:
  id: "maxactive"
  monitored_switch: "relayswitch"

globals:
  - id: ${id}_last_activation
    type: time_t
    restore_value: no
    initial_value: '0'

# Inputs
number:
  - platform: template
    name: "Maximum ON time"
    id: ${id}_max_time_active
    unit_of_measurement: min
    device_class: duration
    initial_value: 30
    optimistic: true
    step: 5
    min_value: 5
    max_value: 1440
    mode: box
    entity_category: config
    restore_value: true

switch:
  - platform: template
    name: Limit Active Time
    id: ${id}_limit_active_time
    icon: mdi:timer-alert-outline
    optimistic: true
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF

script:
  - id: ${id}_on_monitored_switch_turn_on
    then:
      - script.stop: ${id}_watchdog
      - globals.set:
          id: ${id}_last_activation
          value: !lambda "return id(ha_time).now().timestamp;"
      - script.execute: ${id}_watchdog
      - if:
          condition:
            switch.is_on: ${id}_limit_active_time
          then:
            - lambda: |-
                int delay = (int) id(${id}_max_time_active).state;
                time_t target = (id(${id}_last_activation) + (delay * 60));
                ESP_LOGI("LIMITACTIVE", "Active limitation mode engaged at %d", id(ha_time).now().timestamp);
                ESP_LOGI("LIMITACTIVE", "After delay of %d minutes switch will be deactivated at %d..", delay, (int) target);

  - id: ${id}_on_monitored_switch_turn_off
    then:
      - script.stop: ${id}_watchdog
      - logger.log:
          tag: LIMITACTIVE
          level: info
          format: Monitored switch turned off, stopping time limitation watchdog.

  - id: ${id}_watchdog
    then:
      - while:
          condition:
            switch.is_on: ${id}_limit_active_time
          then:
            - if:
                condition:
                  - lambda: 'return (id(ha_time).now().timestamp >= (id(${id}_last_activation) + ((int) id(${id}_max_time_active).state * 60)));'
                then:
                  - logger.log:
                      tag: LIMITACTIVE
                      level: info
                      format: Max active time reached, turning off ${monitored_switch}
                  - switch.turn_off: ${monitored_switch}
            - delay: 5min
