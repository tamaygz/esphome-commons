# Manual and automatic homing for a stepper (see stepper/uln2003.yaml, stepper/a4988.yaml).
#
# MANUAL homing: jog the motor with the 'Move Forward/Backward' buttons (and 'Move Step') until it
#   sits at the desired home position, then press 'Set Home Here'.
# AUTOMATIC homing: press 'Home' (or enable 'Home On Boot'). The motor runs in the homing direction at
#   the homing speed until the *home signal* is asserted, stops, backs off and defines that spot as the
#   home position (= 'Home Position' number, default 0). Fails if the signal is not seen within the
#   'Homing Max Distance'.
#
# The home signal is whatever you decide it is: an endstop (binary_sensor/endstop.yaml), a hall sensor,
# a motion sensor, a button, a Home Assistant automation ... Hook ANY source up by calling the scripts
#   ${stepper_id}_home_signal_on    signal asserted   (e.g. on_press of a binary sensor)
#   ${stepper_id}_home_signal_off   signal released   (e.g. on_release of a binary sensor)
# or through the callback script variables of the gpio based sensors
# (e.g. endstop_press_callback_script: ${stepper_id}_home_signal_on).
# If the signal is already asserted when homing starts, the current position is taken as home.
#
# Variables:
#   stepper_homing_towards_positive  "ON"|"OFF" initial value of the 'Homing Towards Positive' switch
#   stepper_homing_speed             steps/s used while homing (slow = precise)
#   stepper_homing_max_distance      maximum steps travelled while searching the signal
#   stepper_homing_backoff           steps moved away from the signal after it was found
#   stepper_homing_offset            position number assigned to the home position
#   stepper_home_on_boot             "ON"|"OFF" initial value of the 'Home On Boot' switch
substitutions:
  stepper_id: stepper_motor
  stepper_name: "Stepper"
  stepper_position_min: "-3000"
  stepper_position_max: "3000"
  stepper_homing_towards_positive: "OFF"
  stepper_homing_speed: "100"
  stepper_homing_max_distance: "6000"
  stepper_homing_backoff: "50"
  stepper_homing_offset: "0"
  stepper_home_on_boot: "OFF"

esphome:
  on_boot:
    - priority: -200
      then:
        - if:
            condition:
              lambda: 'return id(${stepper_id}_home_on_boot).state;'
            then:
              - logger.log:
                  format: "Home On Boot enabled, starting homing"
                  tag: ${stepper_id}
              - script.execute: ${stepper_id}_home_start

number:
  - platform: template
    id: ${stepper_id}_homing_speed
    name: "${stepper_name} Homing Speed"
    icon: mdi:speedometer-slow
    unit_of_measurement: "steps/s"
    min_value: 1
    max_value: 5000
    step: 1
    mode: box
    initial_value: ${stepper_homing_speed}
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: ${stepper_id}_homing_max_distance
    name: "${stepper_name} Homing Max Distance"
    icon: mdi:ruler
    unit_of_measurement: "steps"
    min_value: 1
    max_value: 1000000
    step: 1
    mode: box
    initial_value: ${stepper_homing_max_distance}
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: ${stepper_id}_homing_backoff
    name: "${stepper_name} Homing Backoff"
    icon: mdi:arrow-u-left-top
    unit_of_measurement: "steps"
    min_value: 0
    max_value: 100000
    step: 1
    mode: box
    initial_value: ${stepper_homing_backoff}
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: ${stepper_id}_home_position
    name: "${stepper_name} Home Position"
    icon: mdi:home-map-marker
    unit_of_measurement: "steps"
    min_value: ${stepper_position_min}
    max_value: ${stepper_position_max}
    step: 1
    mode: box
    initial_value: ${stepper_homing_offset}
    optimistic: true
    restore_value: true
    entity_category: config

switch:
  - platform: template
    id: ${stepper_id}_homing_positive
    name: "${stepper_name} Homing Towards Positive"
    icon: mdi:swap-horizontal
    optimistic: true
    restore_mode: RESTORE_DEFAULT_${stepper_homing_towards_positive}
    entity_category: config
  - platform: template
    id: ${stepper_id}_home_on_boot
    name: "${stepper_name} Home On Boot"
    icon: mdi:restart
    optimistic: true
    restore_mode: RESTORE_DEFAULT_${stepper_home_on_boot}
    entity_category: config

button:
  - platform: template
    id: ${stepper_id}_btn_home
    name: "${stepper_name} Home"
    icon: mdi:home-search
    on_press:
      - script.execute: ${stepper_id}_home_start
  - platform: template
    id: ${stepper_id}_btn_set_home
    name: "${stepper_name} Set Home Here"
    icon: mdi:home-import-outline
    on_press:
      - script.execute: ${stepper_id}_home_manual
  - platform: template
    id: ${stepper_id}_btn_goto_home
    name: "${stepper_name} Go To Home"
    icon: mdi:home-export-outline
    on_press:
      - script.execute:
          id: ${stepper_id}_move_to
          target: !lambda 'return (int) id(${stepper_id}_home_position).state;'

binary_sensor:
  # mirrors the home signal, so it is visible in HA whether the home condition is currently met
  - platform: template
    id: ${stepper_id}_home_signal
    name: "${stepper_name} Home Signal"
    icon: mdi:home-alert-outline
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: ${stepper_id}_homing_result
    name: "${stepper_name} Homing Result"
    icon: mdi:home-clock-outline
    entity_category: diagnostic
  - platform: template
    id: ${stepper_id}_last_homed
    name: "${stepper_name} Last Homed"
    icon: mdi:clock-check-outline
    device_class: timestamp
    entity_category: diagnostic

script:
  # --- home signal inputs (hook your sensor/automation up to these) -------
  - id: ${stepper_id}_home_signal_on
    then:
      - binary_sensor.template.publish:
          id: ${stepper_id}_home_signal
          state: true
      - if:
          condition:
            lambda: 'return id(${stepper_id}_homing_phase) == 1;'
          then:
            - script.execute: ${stepper_id}_home_reached
  - id: ${stepper_id}_home_signal_off
    then:
      - binary_sensor.template.publish:
          id: ${stepper_id}_home_signal
          state: false

  # --- automatic homing ---------------------------------------------------
  - id: ${stepper_id}_home_start
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(${stepper_id}_home_signal).state;'
          then:
            - logger.log:
                format: "Home signal already asserted, taking current position as home"
                tag: ${stepper_id}
            - script.execute: ${stepper_id}_home_manual
          else:
            - script.execute: ${stepper_id}_stop
            - lambda: |-
                id(${stepper_id}_idle_movement_priority) |= 2;
                id(${stepper_id}_homed) = false;
                id(${stepper_id}_homing_phase) = 1;
                id(${stepper_id}_homing_result).publish_state("Searching");
                float dist = id(${stepper_id}_homing_max_distance).state;
                id(${stepper_id}_homing_direction) = id(${stepper_id}_homing_positive).state ? 1 : -1;
                int32_t dir = id(${stepper_id}_homing_direction);
                ESP_LOGI("${stepper_id}", "Homing started towards %s, max %d steps", dir > 0 ? "positive" : "negative", (int) dist);
            - script.execute: ${stepper_id}_move_start_callbacks
            - lambda: |-
                int32_t pos = id(${stepper_id}).current_position;
                int64_t delta = (int64_t) pos - id(${stepper_id}_travel_position);
                if (delta != 0) {
                  id(${stepper_id}_pending_travel) +=
                    (uint32_t) (delta < 0 ? -delta : delta);
                  id(${stepper_id}_travel_position) = pos;
                }
                float dist = id(${stepper_id}_homing_max_distance).state;
                int32_t dir = id(${stepper_id}_homing_direction);
                id(${stepper_id}).set_target(id(${stepper_id}).current_position + dir * (int32_t) dist);
                id(${stepper_id}_move_active) = true;
            - stepper.set_speed:
                id: ${stepper_id}
                speed: !lambda 'return id(${stepper_id}_homing_speed).state;'
            - wait_until:
                condition:
                  lambda: |-
                    int phase = id(${stepper_id}_homing_phase);
                    bool reached = id(${stepper_id}).has_reached_target();
                    return phase == 0 || (phase == 1 && reached);
            - if:
                condition:
                  lambda: 'return id(${stepper_id}_homing_phase) == 1;'
                then:
                  # end of the allowed travel reached without seeing the home signal
                  - lambda: |-
                      id(${stepper_id}_homing_phase) = 0;
                      id(${stepper_id}_homing_result).publish_state("Failed: home signal not found");
                      ESP_LOGE("${stepper_id}", "Homing failed: home signal not found within %d steps", (int) id(${stepper_id}_homing_max_distance).state);
                  - script.execute: ${stepper_id}_apply_settings
            # an aborted homing (stop) leaves the phase at 0 without result: report it
            - if:
                condition:
                  lambda: 'return !id(${stepper_id}_homed) && id(${stepper_id}_homing_phase) == 0 && id(${stepper_id}_homing_result).state == "Searching";'
                then:
                  - lambda: 'id(${stepper_id}_homing_result).publish_state("Aborted");'
                  - script.execute: ${stepper_id}_apply_settings
      - lambda: |-
          id(${stepper_id}_idle_movement_priority) &= ~2;
          id(${stepper_id}_idle_movement_paused) =
            id(${stepper_id}_idle_movement_priority) != 0;

  # called when the home signal is seen while searching
  - id: ${stepper_id}_home_reached
    mode: single
    then:
      - lambda: |-
          id(${stepper_id}_homing_phase) = 2;
          id(${stepper_id}_homing_result).publish_state("Backing off");
          int32_t pos = id(${stepper_id}).current_position;
          ESP_LOGI("${stepper_id}", "Home signal at position %d, backing off", pos);
      - lambda: |-
          int32_t delta_pos = id(${stepper_id}).current_position;
          int64_t delta = (int64_t) delta_pos - id(${stepper_id}_travel_position);
          if (delta != 0) {
            id(${stepper_id}_pending_travel) +=
              (uint32_t) (delta < 0 ? -delta : delta);
            id(${stepper_id}_travel_position) = delta_pos;
          }
          int32_t dir = id(${stepper_id}_homing_direction);
          int32_t pos = id(${stepper_id}).current_position;
          id(${stepper_id}).set_target(pos - dir * (int32_t) id(${stepper_id}_homing_backoff).state);
          id(${stepper_id}_move_active) = true;
      - wait_until:
          condition:
            lambda: 'return id(${stepper_id}_homing_phase) != 2 || id(${stepper_id}).has_reached_target();'
      - if:
          condition:
            lambda: 'return id(${stepper_id}_homing_phase) == 2;'
          then:
            - script.execute: ${stepper_id}_home_manual
          else:
            - if:
                condition:
                  lambda: 'return !id(${stepper_id}_homed);'
                then:
                  - lambda: 'id(${stepper_id}_homing_result).publish_state("Aborted");'
                  - script.execute: ${stepper_id}_apply_settings

  # --- manual homing: declare the current position to be home ---------------
  - id: ${stepper_id}_home_manual
    then:
      - lambda: |-
          id(${stepper_id}_idle_movement_priority) |= 2;
          id(${stepper_id}_homing_phase) = 0;
      - script.execute:
          id: ${stepper_id}_set_position
          position: !lambda 'return (int) id(${stepper_id}_home_position).state;'
      - lambda: |-
          id(${stepper_id}_homed) = true;
          id(${stepper_id}_homing_result).publish_state("Success");
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            id(${stepper_id}_last_homed).publish_state(now.strftime("%Y-%m-%dT%H:%M:%S%z"));
          }
          ESP_LOGI("${stepper_id}", "Homed, position is now %d", id(${stepper_id}).current_position);
      # restore the regular speed (it was lowered while searching)
      - script.execute: ${stepper_id}_apply_settings
      - lambda: |-
          id(${stepper_id}_idle_movement_priority) &= ~2;
          id(${stepper_id}_idle_movement_paused) =
            id(${stepper_id}_idle_movement_priority) != 0;

  - id: !extend ${stepper_id}_stop_callbacks
    then:
      - if:
          condition:
            lambda: 'return id(${stepper_id}_homing_phase) != 0;'
          then:
            - lambda: |-
                id(${stepper_id}_idle_movement_priority) &= ~2;
                id(${stepper_id}_idle_movement_paused) =
                  id(${stepper_id}_idle_movement_priority) != 0;
