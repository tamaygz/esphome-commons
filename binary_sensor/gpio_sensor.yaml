substitutions:
  sensor_id: "gpio_sensor"
  sensor_name: "GPIO Sensor"
  sensor_pin: GPIO02
  sensor_device_class: ""
  signal_start_callback_script: ${sensor_id}_signal_start_dummy
  signal_end_callback_script: ${sensor_id}_signal_stop_dummy

binary_sensor:
  - platform: gpio
    id: ${sensor_id}
    name: "${sensor_name}"
    device_class: ${sensor_device_class}
    pin:
      number: ${sensor_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 25ms
      - delayed_off: 25ms
    on_press:
      - script.execute: ${signal_start_callback_script}
    on_release:
      - script.execute: ${signal_end_callback_script}

script:
  - id: ${sensor_id}_signal_start_dummy
    then:
      - logger.log:
          format: "[START] No script was executed but the dummy instead."
          tag: ${sensor_id}
  - id: ${sensor_id}_signal_stop_dummy
    then:
      - logger.log:
          format: "[STOP] No script was executed but the dummy instead."
          tag: ${sensor_id}
